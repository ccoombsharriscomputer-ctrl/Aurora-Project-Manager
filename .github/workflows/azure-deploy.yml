name: Deploy to Azure App Service

# Mirrors render.yaml's build: "npm install --include=dev && npm run build" produces
# server/dist and client/dist, then the whole repo (including node_modules) is deployed as-is
# so the App Service's Startup Command can run the exact same "npm run prisma:deploy -w
# server && npm run start -w server" Render already uses — no separate build step on the
# App Service side, no Oryx auto-detection to fight with across an npm-workspaces monorepo.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing for the same App Service (e.g. a push-triggered run and a manual
# workflow_dispatch landing at the same time) makes Azure's OneDeploy API reject the loser
# with a 400 Bad Request — confirmed via a real failed run, not theoretical. Queuing runs for
# the same ref instead of letting them race means every push still gets its own real deploy
# attempt, just serialized, rather than one failing outright.
concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: APM

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm install --include=dev
          npm run build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
