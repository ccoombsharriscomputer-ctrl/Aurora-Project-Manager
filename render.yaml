databases:
  - name: aurora-pm-db
    plan: free
    databaseName: aurora_pm
    user: aurora_app

services:
  - type: web
    name: aurora-project-manager
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:deploy -w server && npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurora-pm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Only needed for "Create project from a contract (PDF)" — set this in the Render
      # dashboard to a key from console.anthropic.com. Without it, that one feature
      # returns a friendly error; everything else works fine.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Only needed to show live TeamSupport ticket status on projects — set both in the
      # Render dashboard from TeamSupport's Setup > API page. Without them, that section
      # returns a friendly error; everything else works fine.
      - key: TEAMSUPPORT_ORG_ID
        sync: false
      - key: TEAMSUPPORT_API_TOKEN
        sync: false
